<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEC-EPN | Unidad 2 Nombres de rango</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;font:16px Segoe UI,Arial;color:#1e3049}header{background:#fff;border-bottom:4px solid #163f78;padding:16px 4vw;display:flex;justify-content:space-between;gap:12px;font-weight:800;color:#163f78}header b{color:#bd2b40}main{max-width:1250px;margin:20px auto;padding:0 16px}.slide{background:white;border:1px solid #dce4ef;border-radius:16px;padding:clamp(22px,4vw,45px);min-height:74vh}.kicker{color:#bd2b40;font-size:13px;font-weight:800;letter-spacing:.1em}h1{font-size:clamp(28px,4vw,48px);margin:12px 0}h2{font-size:clamp(21px,3vw,30px)}.lead{font-size:19px;line-height:1.7;color:#586e86}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}.panel{background:#f7faff;border:1px solid #dce4ef;border-radius:12px;padding:20px}.code{white-space:pre-wrap;background:#142c45;color:#d8f0ff;padding:20px;border-radius:10px;min-height:120px;font:16px/1.7 Consolas,monospace;overflow:auto}.note{background:#edf3fa;border-left:4px solid #163f78;padding:15px;border-radius:5px;line-height:1.6}button{cursor:pointer;border:1px solid #c4d1e0;border-radius:8px;background:white;color:#163f78;padding:11px 15px;font-weight:750}button.primary{background:#163f78;color:white;border-color:#163f78}button:hover{filter:brightness(.94)}button:disabled{opacity:.5}input,select{padding:10px;border:1px solid #bac8d9;border-radius:7px;max-width:100%}.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.feedback{background:#eaf4ed;border:1px solid #c7e2d0;padding:12px;border-radius:7px;min-height:45px}.excel{border:1px solid #b9d0c2;border-radius:10px;overflow:hidden}.excelbar{background:#217346;color:white;padding:12px;font-weight:800}.sheet{border-collapse:collapse;width:100%;font-size:14px}.sheet td,.sheet th{border:1px solid #d4dfd7;padding:10px;text-align:left}.sheet th{background:#eaf0eb}.activecell{background:#d6efdf!important;outline:2px solid #217346;outline-offset:-2px}.lab{margin-top:20px;padding-top:16px;border-top:1px solid #dce4ef}footer{max-width:1250px;margin:auto;padding:8px 18px 25px;display:flex;justify-content:space-between;align-items:center;gap:10px}#progress{position:fixed;top:0;left:0;height:5px;background:#bd2b40;width:0}.muted{font-size:13px;color:#687c91}@media(max-width:740px){.grid{grid-template-columns:1fr}header{font-size:12px}.slide{min-height:68vh}.code{font-size:13px}}
</style></head><body><div id="progress"></div><header><div>CEC <b>●</b> EPN | EDUCACIÓN CONTINUA</div><div>EXCEL · UNIDAD 2 · 5 HORAS</div></header><main><div class="slide"><div class="kicker" id="kicker"></div><h1 id="title"></h1><h2 id="subtitle"></h2><p class="lead" id="description"></p><div class="grid"><div class="panel"><h3>Ejemplo o fórmula</h3><pre class="code" id="code"></pre></div><div class="panel"><h3>¿Para qué sirve?</h3><div class="note" id="note"></div><p class="muted">Usa Anterior y Siguiente para recorrer la clase.</p></div></div><div class="lab" id="lab"></div></div></main><footer><button onclick="move(-1)">← Anterior</button><span id="counter"></span><div class="tool"><button onclick="fullscreen()">⛶ Pantalla completa</button><button class="primary" onclick="move(1)">Siguiente →</button></div></footer><script>
const slides=[["Unidad 2 · Nombres de rango","5 horas · Excel Intermedio · Santillana","Comprenderás cómo asignar nombres a celdas, columnas y constantes, insertarlos en fórmulas, administrarlos y cruzar rangos.","=SUMA(Ventas)"],["Ruta de aprendizaje","Plan de 5 horas","Definir nombres: 40 min · Crear desde encabezados: 45 min · Constantes: 35 min · Pegar nombres: 45 min · Administrador: 55 min · Intersección: 45 min · Práctica final: 35 min.","Fórmulas → Administrador de nombres"],["2.1.1 · Definición","¿Qué es un nombre de rango?","Un nombre es una etiqueta que representa una celda, un rango, una constante o una fórmula. Sirve para escribir fórmulas comprensibles.","=SUMA(C2:C5)\n=SUMA(Ventas)"],["2.1.1 · Paso a paso","Definir un nombre de rango","Selecciona C2:C5 → haz clic en el Cuadro de nombres a la izquierda de la barra de fórmulas → escribe Ventas → pulsa Enter. Prueba el simulador.","Ventas → C2:C5"],["2.1.1 · Reglas","Nombres válidos e inválidos","No uses espacios ni referencias como A1. Usa nombres descriptivos, por ejemplo Ventas_2026. Los nombres no distinguen mayúsculas.","Ventas_2026 ✓\nVenta Neta ✗\nA1 ✗"],["2.1.2 · Encabezados","Crear nombres desde el texto de hoja","Selecciona una tabla con sus encabezados → Fórmulas → Crear desde la selección → Fila superior → Aceptar.","Mes | Ventas | Costos\nEne | 300 | 180\nFeb | 400 | 220"],["2.1.2 · Texto","Encabezados con espacios","Si el encabezado dice Venta Neta, Excel puede convertirlo en Venta_Neta. Comprueba el resultado en el Administrador de nombres.","Venta Neta → Venta_Neta"],["2.1.3 · Constantes","Nombrar constantes","Fórmulas → Administrador de nombres → Nuevo. Nombre: TasaEjemplo. Se refiere a: =0,15 si Excel utiliza coma decimal.","TasaEjemplo = 0,15\n=Precio*TasaEjemplo"],["2.1.3 · Simulador","Calcula con una constante","Una constante con nombre permite reutilizar una tasa de ejemplo en múltiples cálculos. Cambia el precio y observa el resultado.","Precio × TasaEjemplo"],["2.1.4 · Fórmulas","Pegar un nombre en una fórmula","Escribe =SUMA( en una celda, pulsa F3 o Fórmulas → Utilizar en la fórmula, selecciona Ventas, cierra el paréntesis y confirma.","=SUMA(Ventas)"],["2.1.4 · Beneficios","Fórmulas más claras","Los nombres permiten entender los cálculos sin memorizar referencias y facilitan su mantenimiento.","=SUMA(Ventas)\n=PROMEDIO(Costos)"],["2.1.5 · Administrador","Gestionar nombres","Abre Fórmulas → Administrador de nombres o Ctrl+F3. Desde allí puedes crear, editar, eliminar y consultar referencias y ámbitos.","Ventas → Hoja1!$B$2:$B$5"],["2.1.5 · Ámbito","Libro y hoja","Un nombre con ámbito Libro funciona desde varias hojas. Un nombre con ámbito Hoja es local a esa hoja.","=SUMA(Ventas)\n=SUMA(Hoja1!Ventas)"],["2.1.6 · Intersección","El espacio es un operador","Un espacio entre dos rangos o nombres devuelve las celdas comunes. FilaMarzo = B4:D4 y ColVentas = C2:C5 se cruzan en C4.","=SUMA(FilaMarzo ColVentas)"],["2.1.6 · Simulador","Encuentra la celda común","Elige una fila y una columna. El simulador muestra la celda de intersección y el valor correspondiente.","B4:D4 ∩ C2:C5 = C4"],["Errores frecuentes","¿Qué puede salir mal?","#¿NOMBRE? indica que Excel no reconoce un nombre. #¡NULO! puede indicar que no hay intersección entre los rangos.","#¿NOMBRE?\n#¡NULO!"],["Práctica Santillana","Reporte mensual editorial","Crea nombres para Ventas y Costos desde encabezados, una constante MetaMensual, inserta un nombre con F3, edita un nombre y utiliza intersección.","=SUMA(Ventas)\n=PROMEDIO(Costos)"],["Evaluación interactiva","Comprueba lo aprendido","Responde las preguntas del cuestionario y revisa la explicación inmediata de cada respuesta.","Cuadro de nombres · F3 · Intersección"],["Cierre","Seis herramientas, un reporte más claro","Definir nombres, crearlos desde encabezados, nombrar constantes, insertarlos, administrarlos y utilizar intersecciones.","=SUMA(Ventas)"]];let index=0;const $=id=>document.getElementById(id);let names=[['Ventas','=Hoja1!$B$2:$B$5'],['Costos','=Hoja1!$C$2:$C$5'],['TasaEjemplo','=0,15']];let selected=0;
function move(n){index=Math.max(0,Math.min(slides.length-1,index+n));render();scrollTo(0,0)}
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function render(){let s=slides[index];$('kicker').textContent='DIAPOSITIVA '+(index+1)+' · UNIDAD 2';$('title').textContent=s[0];$('subtitle').textContent=s[1];$('description').textContent=s[2];$('code').textContent=s[3];$('note').textContent=index===0?'Objetivo: aprender seis herramientas para mejorar reportes en Excel.':'Ejemplo práctico aplicado a reportes de ventas y costos de Santillana.';$('counter').textContent=(index+1)+' / '+slides.length;$('progress').style.width=((index+1)/slides.length*100)+'%';$('lab').innerHTML='';if(index===3)defineLab();if(index===5)headerLab();if(index===8)constantLab();if(index===9)pasteLab();if(index===11)managerLab();if(index===14)intersectLab();if(index===17)quizLab()}
function defineLab(){$('lab').innerHTML='<h3>Simulador: Cuadro de nombres</h3><div class="excel"><div class="excelbar">▦ Excel · Ventas</div><div class="tool"><label>Cuadro de nombres <input id="newname" value="C2:C5"></label><button class="primary" onclick="defineName()">↵ Definir</button></div><table class="sheet"><tr><th>Fila</th><th>B</th><th>C</th></tr><tr><th>2</th><td>Teclado</td><td class="activecell">25</td></tr><tr><th>3</th><td>Ratón</td><td class="activecell">15</td></tr><tr><th>4</th><td>Monitor</td><td class="activecell">120</td></tr><tr><th>5</th><td>Audífonos</td><td class="activecell">40</td></tr></table></div><div id="fb" class="feedback">Escribe Ventas y pulsa Definir.</div>'}
function defineName(){$('fb').textContent=$('newname').value.trim().toLowerCase()==='ventas'?'✓ Correcto: Ventas representa C2:C5. =SUMA(Ventas) devuelve 200.':'Escribe Ventas (sin espacios).'}
function headerLab(){$('lab').innerHTML='<h3>Simulación: Crear desde la selección</h3><div class="tool"><button class="primary" onclick="document.getElementById(\'fb\').textContent=\'✓ Mes → A2:A5; Ventas → B2:B5; Costos → C2:C5.\'">Crear nombres desde encabezados</button></div><div class="feedback" id="fb">En Excel selecciona A1:C5 y marca Fila superior.</div>'}
function constantLab(){$('lab').innerHTML='<h3>Simulador: constante con nombre</h3><div class="tool"><label>Precio: <input id="price" type="number" value="100"></label><button class="primary" onclick="document.getElementById(\'fb\').textContent=\'Resultado: \'+(Number(document.getElementById(\'price\').value)*0.15).toFixed(2)">Calcular</button></div><div class="feedback" id="fb">TasaEjemplo = 0,15. Cambia el precio.</div>'}
function pasteLab(){$('lab').innerHTML='<h3>Simulador: insertar nombre en fórmula</h3><div class="tool"><select id="chosen"><option>Ventas</option><option>Costos</option></select><button class="primary" onclick="document.getElementById(\'fb\').textContent=\'=SUMA(\'+document.getElementById(\'chosen\').value+\')\'">Insertar nombre</button></div><div class="feedback" id="fb">=SUMA(</div>'}
function managerLab(){let rows=names.map((n,i)=>'<tr style="cursor:pointer;'+(i===selected?'background:#d6efdf':'')+'" onclick="selected='+i+';managerLab()"><td>'+n[0]+'</td><td>'+n[1]+'</td><td>Libro</td></tr>').join('');$('lab').innerHTML='<h3>Simulador: Administrador de nombres</h3><div class="tool"><button class="primary" onclick="names.push([\'MetaMensual\',\'=400\']);selected=names.length-1;managerLab()">+ Nuevo</button><button onclick="if(names.length){names[selected][1]=\'=Hoja1!$B$2:$B$6\';managerLab()}">Editar</button><button onclick="if(names.length){names.splice(selected,1);selected=0;managerLab()}">Eliminar</button></div><div style="overflow:auto"><table class="sheet"><tr><th>Nombre</th><th>Se refiere a</th><th>Ámbito</th></tr>'+rows+'</table></div><p class="muted">Selecciona una fila. Los cambios son simulados.</p>'}
function intersectLab(){$('lab').innerHTML='<h3>Simulador: Intersección de rangos</h3><div class="tool"><label>Fila <select id="r"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option></select></label><label>Columna <select id="c"><option>B</option><option selected>C</option><option>D</option></select></label><button class="primary" onclick="intersection()">Encontrar celda común</button></div><div class="feedback" id="fb">B4:D4 ∩ C2:C5 = C4, valor 300.</div>'}
function intersection(){let r=Number($('r').value),c=$('c').value,vals={B:[100,120,130,140],C:[200,250,300,350],D:[50,70,80,90]};$('fb').textContent='Intersección: '+c+r+' = '+vals[c][r-2]}
const qs=[['¿Qué comando crea nombres desde encabezados?',['Crear desde la selección','Formato condicional','Ordenar'],0],['¿Qué tecla abre Pegar nombre?',['F12','F3','Esc'],1],['¿Qué operador devuelve celdas comunes?',['Espacio','Coma','Dos puntos'],0],['¿Dónde puedes editar un nombre?',['Administrador de nombres','Vista previa','Diseño de página'],0]];let qi=0,points=0;
function quizLab(){qi=0;points=0;drawQuestion()}
function drawQuestion(){let q=qs[qi];$('lab').innerHTML='<h3>Pregunta '+(qi+1)+' / '+qs.length+'</h3><p>'+q[0]+'</p><div class="tool">'+q[1].map((v,i)=>'<button onclick="answer('+i+')">'+v+'</button>').join('')+'</div><div id="fb" class="feedback">Elige una respuesta.</div><button class="primary" onclick="nextQ()">Siguiente pregunta →</button>'}
function answer(i){let ok=i===qs[qi][2];if(ok)points++;$('fb').textContent=ok?'✓ Correcto':'Respuesta correcta: '+qs[qi][1][qs[qi][2]];[...$('lab').querySelectorAll('.tool button')].forEach(b=>b.disabled=true)}
function nextQ(){if(qi<qs.length-1){qi++;drawQuestion()}else $('lab').innerHTML='<h3>Fin del cuestionario</h3><p>Resultado: '+points+' de '+qs.length+'</p><button onclick="quizLab()">Repetir</button>'}
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();
</script></body></html>
