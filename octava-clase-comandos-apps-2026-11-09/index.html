<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octava clase | Comandos básicos para apps</title><style>
:root{--red:#ad2437;--ink:#1b2738;--muted:#657287}*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:var(--ink);font-family:Segoe UI,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #dde3eb;padding:17px 4vw;display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700}header b{color:var(--red)}.wrap{max-width:1220px;margin:22px auto;padding:0 18px}.slide{display:none;background:white;border:1px solid #dce3eb;border-radius:16px;padding:clamp(22px,4vw,44px);min-height:75vh}.slide.active{display:block}.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(28px,4vw,47px);line-height:1.12;margin:12px 0 15px}h2{font-size:clamp(21px,2.8vw,29px);margin:0 0 10px}.intro{font-size:18px;color:#586477;line-height:1.65;max-width:900px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:23px 0}.pane{border:1px solid #dce3eb;border-radius:12px;overflow:hidden}.panehead{background:#e9edf3;padding:12px 17px;font-weight:800;font-size:13px}.pane pre{margin:0;padding:22px;background:#172334;color:#e9f1fb;min-height:255px;white-space:pre-wrap;overflow:auto;font:15px/1.7 Consolas,monospace}.pane.output pre{background:#111a26;color:#b7f0cb}.explainer{border:1px solid #e5d7da;background:#fff9fa;border-radius:12px;padding:20px;margin-top:16px}.explainer h3{margin:0 0 10px;font-size:18px}.step{font-size:17px;line-height:1.7;min-height:50px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{cursor:pointer;border-radius:8px;border:1px solid #ccd5df;background:#fff;color:#243044;padding:10px 16px;font-weight:700}button.primary{background:var(--red);color:#fff;border-color:var(--red)}button:hover{filter:brightness(.95)}footer{max-width:1220px;margin:0 auto;padding:4px 18px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}.counter{color:#647287;font-size:13px}.practice{margin-top:16px;border-top:1px solid #e3e7ed;padding-top:16px}.practice input{border:1px solid #ccd5df;border-radius:8px;padding:10px;width:150px;margin:5px}.practice pre{background:#111a26;color:#b7f0cb;padding:14px;border-radius:8px;white-space:pre-wrap;min-height:50px}#progress{height:5px;background:var(--red);position:fixed;top:0;left:0;width:0;transition:width .3s}@media(max-width:750px){.columns{grid-template-columns:1fr}.pane pre{min-height:170px;font-size:13px}header{font-size:11px}.slide{min-height:70vh}footer button{padding:9px}}</style></head><body><div id="progress"></div><header><b>OCTAVA CLASE · PRIMER PARCIAL</b><span>09/11/2026 · COMANDOS BÁSICOS DE PROGRAMACIÓN PARA APPS</span></header><div class="wrap"><section id="slide" class="slide active"><div class="eyebrow" id="tag"></div><h1 id="title"></h1><h2 id="subtitle"></h2><p class="intro" id="intro"></p><div class="columns"><div class="pane"><div class="panehead">⌨ CÓDIGO PYTHON</div><pre id="code"></pre></div><div class="pane output"><div class="panehead">▣ RESULTADO EN CONSOLA (EJEMPLO)</div><pre id="output"></pre></div></div><div class="explainer"><h3>▶ Explicación automática paso a paso</h3><div id="step" class="step"></div><div class="tools"><button onclick="nextStep()">Siguiente paso →</button><button onclick="restart()">↻ Repetir</button><button id="pause" onclick="togglePause()">⏸ Pausar</button><button onclick="copyCode()">Copiar código</button></div></div><div class="practice" id="practice" hidden><h3>Prueba los valores de entrada</h3><label>Nombre: <input id="nameVal" value="Ana"></label><label>Edad: <input id="ageVal" type="number" value="20"></label><button class="primary" onclick="runExample()">Ejecutar simulación</button><pre id="sim"></pre><p style="color:#687587;font-size:13px">Simulación de este ejemplo en el navegador; el código mostrado corresponde a Python.</p></div></section></div><footer><button onclick="move(-1)">← Anterior</button><span class="counter" id="counter"></span><div style="display:flex;gap:8px"><button onclick="full()">⛶ Pantalla completa</button><button class="primary" onclick="move(1)">Siguiente →</button></div></footer><script>
const slides=[["Portada","Comandos básicos de programación para apps","Una app comienza con instrucciones: mostrar información, recibir datos, calcular y tomar decisiones.","print('Mi primera app')","Mi primera app","Hoy construiremos pequeñas apps de consola. No usaremos bibliotecas, ciclos ni interfaces gráficas."],["¿Qué es un comando?","Una instrucción le dice a Python qué hacer","Las apps siguen una secuencia: entrada → procesamiento → salida.","print('Bienvenido')\nprint('Sistema iniciado')","Bienvenido\nSistema iniciado","Primero se ejecuta la línea 1; luego la línea 2. El orden importa."],["print()","Mostrar mensajes en pantalla","print() presenta información en la consola. El texto va entre comillas.","print('Hola, estudiante')\nprint('Bienvenido a mi app')","Hola, estudiante\nBienvenido a mi app","La función print() toma el texto y lo muestra. Cada llamada normalmente inicia una línea."],["Variables","Guardar datos de una app","Una variable conserva un valor para utilizarlo después.","nombre = 'Ana'\nedad = 19\nprint(nombre)\nprint(edad)","Ana\n19","Primero se guarda 'Ana' en nombre y 19 en edad. Después print() muestra sus valores."],["input()","Solicitar datos al usuario","input() permite escribir información desde el teclado.","nombre = input('Tu nombre: ')\nprint('Hola', nombre)","Tu nombre: Luis\nHola Luis","Python muestra la pregunta, espera la respuesta y la guarda en nombre. Luego saluda."],["int()","Convertir una entrada en número entero","input() devuelve texto; int() convierte un número escrito a entero.","edad = int(input('Edad: '))\nprint('El próximo año tendrás', edad + 1)","Edad: 20\nEl próximo año tendrás 21","Se recibe '20' como texto; int() lo convierte a 20 y se suma 1."],["float()","Trabajar con números decimales","float() convierte una entrada numérica a decimal.","precio = float(input('Precio: '))\nprint('Precio con IVA de ejemplo:', precio * 1.15)","Precio: 10\nPrecio con IVA de ejemplo: 11.5","El usuario ingresa 10, se convierte a decimal y se multiplica por 1.15. La tasa es solo un ejemplo didáctico."],["Operadores","Calcular resultados","Usamos +, -, *, /, //, % y ** para operar con números.","a = 10\nb = 3\nprint(a + b)\nprint(a * b)\nprint(a % b)","13\n30\n1","Primero se suman 10 y 3; luego se multiplican; finalmente % obtiene el residuo de 10 entre 3."],["f-strings","Mostrar resultados con claridad","Una f-string inserta variables o cálculos dentro de un mensaje.","producto = 'Cuaderno'\nprecio = 2.5\nprint(f'{producto}: $ {precio}')","Cuaderno: $ 2.5","La letra f permite sustituir {producto} y {precio} por sus valores."],["Comparaciones","¿Se cumple una condición?","Los operadores ==, !=, >, \u003c, >= y \u003c= producen True o False.","edad = 18\nprint(edad >= 18)\nprint(edad \u003c 18)","True\nFalse","Python compara edad con 18: la primera expresión es verdadera y la segunda falsa."],["if","Tomar una decisión sencilla","Si una condición es verdadera, Python ejecuta el bloque indentado.","saldo = 12\nif saldo >= 10:\n    print('Compra permitida')","Compra permitida","Python verifica si 12 es mayor o igual a 10. Como sí lo es, ejecuta el print indentado."],["if y else","Elegir entre dos caminos","else se ejecuta cuando la condición de if es falsa.","clave = input('Clave: ')\nif clave == '1234':\n    print('Acceso permitido')\nelse:\n    print('Clave incorrecta')","Clave: 1111\nClave incorrecta","Se compara la clave ingresada con '1234'. Como no coincide, se ejecuta else."],["elif","Elegir entre varias opciones","elif permite revisar otra condición si la anterior no se cumple.","opcion = int(input('Opción 1 o 2: '))\nif opcion == 1:\n    print('Ver perfil')\nelif opcion == 2:\n    print('Ver ajustes')\nelse:\n    print('Opción inválida')","Opción 2 o 1: 2\nVer ajustes","Python revisa la primera opción; si es falsa, revisa la segunda. Solo se ejecuta el bloque que corresponda."],["App 1","Calculadora de compras","Construye una app que calcule el total de unidades compradas.","precio = float(input('Precio unitario: '))\ncantidad = int(input('Cantidad: '))\ntotal = precio * cantidad\nprint(f'Total: $ {total}')","Precio unitario: 3\nCantidad: 4\nTotal: $ 12.0","Se recibe el precio, luego la cantidad; se multiplican y se imprime el total."],["App 2","Evaluador de calificaciones","Una condición transforma un dato en una decisión.","nota = float(input('Nota / 10: '))\nif nota >= 7:\n    print('Aprobado')\nelse:\n    print('En recuperación')","Nota / 10: 8\nAprobado","Se recibe la nota 8, se compara con 7 y se muestra el mensaje del bloque if."],["App 3","Menú de una aplicación","Un menú de texto permite escoger qué acción ejecutar.","print('1. Saludar')\nprint('2. Despedirse')\nopcion = input('Elige: ')\nif opcion == '1':\n    print('¡Hola!')\nelif opcion == '2':\n    print('¡Hasta luego!')\nelse:\n    print('Opción no válida')","1. Saludar\n2. Despedirse\nElige: 1\n¡Hola!","Se imprimen las opciones, se lee la elección y se evalúa con if, elif y else."],["App 4","Simulador de recarga móvil","Combinamos datos, operaciones y condiciones.","saldo = float(input('Saldo actual: '))\nrecarga = float(input('Recarga: '))\nif recarga > 0:\n    saldo = saldo + recarga\n    print(f'Nuevo saldo: $ {saldo}')\nelse:\n    print('Recarga inválida')","Saldo actual: 5\nRecarga: 3\nNuevo saldo: $ 8.0","Se ingresan dos valores. Si la recarga es positiva, se suma al saldo y se muestra el resultado."],["Errores frecuentes","Aprende a reconocerlos","Las comillas, los dos puntos y la indentación son esenciales.","edad = int(input('Edad: '))\nif edad >= 18:\n    print('Mayor de edad')","Edad: 18\nMayor de edad","Observa los dos puntos al final de if y los cuatro espacios antes de print. No olvides cerrar comillas y paréntesis."],["Laboratorio","Cambia el código y prueba el resultado","En el simulador puedes editar el programa y cambiar los valores de entrada para ver cómo funciona.","nombre = input('Nombre: ')\nedad = int(input('Edad: '))\nif edad >= 18:\n    print(f'{nombre}: mayor de edad')\nelse:\n    print(f'{nombre}: menor de edad')","Nombre: Ana\nEdad: 20\nAna: mayor de edad","Prueba con Ana y 20; después cambia la edad a 15 y observa qué mensaje aparece."],["Reto y deber","Crea tu primera mini app","Diseña una app de consola que pida nombre, producto, precio y cantidad; calcule el total y muestre si supera $20.","nombre = input('Cliente: ')\nprecio = float(input('Precio: '))\ncantidad = int(input('Cantidad: '))\ntotal = precio * cantidad\nprint(f'{nombre}, total: $ {total}')\nif total > 20:\n    print('Compra mayor a $20')\nelse:\n    print('Compra de hasta $20')","Cliente: Luis\nPrecio: 6\nCantidad: 4\nLuis, total: $ 24.0\nCompra mayor a $20","Entrega el archivo .py y una captura de su ejecución. Solo print, input, variables, operadores y condicionales."]];let idx=0,stepIndex=0,paused=false,timer;
const el=id=>document.getElementById(id);
function stepsFor(s){const lines=s[3].split('\n').filter(x=>x.trim());return lines.map((line,i)=>'Línea '+(i+1)+': '+line.trim()+' — '+(line.includes('input(')?'Solicita un valor al usuario y lo guarda.':line.trim().startsWith('print(')?'Muestra información en la consola.':line.trim().startsWith('if ')?'Evalúa si se cumple la condición.':line.trim().startsWith('elif ')?'Comprueba una condición alternativa.':line.trim().startsWith('else:')?'Indica qué ocurre si no se cumplen las condiciones anteriores.':line.includes(' = ')?'Asigna o calcula un valor para una variable.':'Ejecuta esta instrucción según el orden del programa.')); }
function show(){const s=slides[idx];el('tag').textContent='Diapositiva '+(idx+1)+' · Octava clase';el('title').textContent=s[1];el('subtitle').textContent=s[0];el('intro').textContent=s[2];el('code').textContent=s[3];el('output').textContent=s[4];el('counter').textContent=(idx+1)+' / '+slides.length;el('progress').style.width=((idx+1)/slides.length*100)+'%';el('practice').hidden=idx!==18;stepIndex=0;paused=false;el('pause').textContent='⏸ Pausar';renderStep();clearInterval(timer);timer=setInterval(()=>{if(!paused)nextStep()},3500);window.scrollTo(0,0)}
function renderStep(){const s=slides[idx];const arr=stepsFor(s);el('step').textContent=stepIndex<arr.length?arr[stepIndex]:s[5]}
function nextStep(){const len=stepsFor(slides[idx]).length;if(stepIndex<len)stepIndex++;else stepIndex=0;renderStep()}
function restart(){stepIndex=0;paused=false;el('pause').textContent='⏸ Pausar';renderStep()}
function togglePause(){paused=!paused;el('pause').textContent=paused?'▶ Continuar':'⏸ Pausar'}
function move(n){idx=Math.max(0,Math.min(slides.length-1,idx+n));show()}
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function copyCode(){const t=slides[idx][3];if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t);else{const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}}
function runExample(){const n=el('nameVal').value||'Usuario';const a=Number(el('ageVal').value);el('sim').textContent='Nombre: '+n+'\nEdad: '+a+'\n'+n+': '+(a>=18?'mayor de edad':'menor de edad')}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});show();
</script></body></html>
