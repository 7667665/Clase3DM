<script>const slides=[{"tag": "01 · IDEA", "title": "Las figuras también son matemáticas", "desc": "En consola podemos calcular espacios, símbolos y dimensiones. Python construye cada línea a partir de operaciones.", "code": "ancho = 7\nprint(\"*\" * ancho)", "output": "*******", "tip": "Multiplicar una cadena por un entero repite ese carácter. No necesitamos ciclos."}, {"tag": "02 · OPERACIÓN", "title": "Multiplicar caracteres", "desc": "El operador * funciona con números, pero también permite repetir texto.", "code": "cantidad = 5\nprint(3 * cantidad)\nprint(\"#\" * cantidad)", "output": "15\n#####", "tip": "3 * 5 calcula un número; \"#\" * 5 crea una cadena de cinco símbolos."}, {"tag": "03 · OPERACIÓN", "title": "Sumar cadenas", "desc": "El operador + une cadenas. Así construimos líneas con espacios y estrellas.", "code": "espacios = 3\nestrellas = 5\nprint(\" \" * espacios + \"*\" * estrellas)", "output": "   *****", "tip": "Los espacios también son caracteres y pueden multiplicarse."}, {"tag": "04 · FIGURA", "title": "Cuadrado sólido", "desc": "Un cuadrado de 5 columnas y 5 filas. Cada línea usa el ancho como variable.", "code": "lado = 5\nlinea = \"■\" * lado\nprint(linea)\nprint(linea)\nprint(linea)\nprint(linea)\nprint(linea)", "output": "■■■■■\n■■■■■\n■■■■■\n■■■■■\n■■■■■", "tip": "Todavía no usamos for: escribimos cada print() explícitamente."}, {"tag": "05 · CÁLCULO", "title": "Cuadrado hueco", "desc": "El interior depende del lado: espacios = lado - 2.", "code": "lado = 6\nborde = \"*\" * lado\ncentro = \"*\" + \" \" * (lado - 2) + \"*\"\nprint(borde)\nprint(centro)\nprint(centro)\nprint(centro)\nprint(centro)\nprint(borde)", "output": "******\n*    *\n*    *\n*    *\n*    *\n******", "tip": "Los dos asteriscos de los extremos ocupan dos posiciones; por eso restamos 2."}, {"tag": "06 · CÁLCULO", "title": "Rectángulo con variables", "desc": "La anchura y la altura son distintas. Calculamos la línea y decidimos cuántas veces imprimirla manualmente.", "code": "ancho = 9\nlinea = \"#\" * ancho\nprint(linea)\nprint(linea)\nprint(linea)\nprint(linea)", "output": "#########\n#########\n#########\n#########", "tip": "Más adelante automatizaremos las filas; hoy solo trabajamos con operaciones."}, {"tag": "07 · CÁLCULO", "title": "Triángulo creciente", "desc": "El número de estrellas aumenta según el nivel: 1, 2, 3, 4 y 5.", "code": "base = 5\nprint(\"*\" * (base - 4))\nprint(\"*\" * (base - 3))\nprint(\"*\" * (base - 2))\nprint(\"*\" * (base - 1))\nprint(\"*\" * base)", "output": "*\n**\n***\n****\n*****", "tip": "Cada fila calcula cuántas estrellas debe mostrar."}, {"tag": "08 · CÁLCULO", "title": "Triángulo invertido", "desc": "Restamos una estrella por cada nivel para construir la figura opuesta.", "code": "base = 5\nprint(\"*\" * base)\nprint(\"*\" * (base - 1))\nprint(\"*\" * (base - 2))\nprint(\"*\" * (base - 3))\nprint(\"*\" * (base - 4))", "output": "*****\n****\n***\n**\n*", "tip": "El mismo operador produce una figura distinta al cambiar el orden."}, {"tag": "09 · FÓRMULA", "title": "Pirámide centrada", "desc": "Para una pirámide de cinco niveles, las estrellas siguen 2 × nivel − 1 y los espacios son altura − nivel.", "code": "altura = 5\nprint(\" \" * (altura - 1) + \"*\" * (2 * 1 - 1))\nprint(\" \" * (altura - 2) + \"*\" * (2 * 2 - 1))\nprint(\" \" * (altura - 3) + \"*\" * (2 * 3 - 1))\nprint(\" \" * (altura - 4) + \"*\" * (2 * 4 - 1))\nprint(\" \" * (altura - 5) + \"*\" * (2 * 5 - 1))", "output": "    *\n   ***\n  *****\n *******\n*********", "tip": "Fórmulas: espacios = altura − nivel; estrellas = 2 × nivel − 1."}, {"tag": "10 · FÓRMULA", "title": "Pirámide invertida", "desc": "La pirámide empieza ancha y se reduce de dos en dos estrellas.", "code": "altura = 4\nprint(\" \" * 0 + \"*\" * (2 * 4 - 1))\nprint(\" \" * 1 + \"*\" * (2 * 3 - 1))\nprint(\" \" * 2 + \"*\" * (2 * 2 - 1))\nprint(\" \" * 3 + \"*\" * (2 * 1 - 1))", "output": "*******\n *****\n  ***\n   *", "tip": "Las estrellas son siempre un número impar: 7, 5, 3, 1."}, {"tag": "11 · COMPOSICIÓN", "title": "Árbol de Navidad", "desc": "Combinamos la fórmula de la pirámide con un tronco centrado.", "code": "h = 5\nprint(\" \" * 4 + \"*\" * 1)\nprint(\" \" * 3 + \"*\" * 3)\nprint(\" \" * 2 + \"*\" * 5)\nprint(\" \" * 1 + \"*\" * 7)\nprint(\" \" * 0 + \"*\" * 9)\nprint(\" \" * (h - 1) + \"|\")\nprint(\" \" * (h - 1) + \"|\")", "output": "    *\n   ***\n  *****\n *******\n*********\n    |\n    |", "tip": "El tronco usa h − 1 espacios para quedar bajo la punta."}, {"tag": "12 · COMPOSICIÓN", "title": "Estrella geométrica", "desc": "Podemos crear una estrella estilizada con una pirámide superior y dos alas.", "code": "print(\" \" * 4 + \"*\")\nprint(\" \" * 3 + \"***\")\nprint(\"*\" * 9)\nprint(\" \" * 2 + \"*****\")\nprint(\" \" * 1 + \"**\" + \" \" * 3 + \"**\")\nprint(\"*\" + \" \" * 7 + \"*\")", "output": "    *\n   ***\n*********\n  *****\n **   **\n*       *", "tip": "Cada parte se forma mediante multiplicación y concatenación de cadenas."}, {"tag": "13 · COMPOSICIÓN", "title": "Una casa con techo", "desc": "El techo usa una pirámide; la fachada usa líneas huecas y una base.", "code": "ancho = 9\nprint(\" \" * 4 + \"^\")\nprint(\" \" * 3 + \"^\" * 3)\nprint(\" \" * 2 + \"^\" * 5)\nprint(\" \" * 1 + \"^\" * 7)\nprint(\"#\" * ancho)\nprint(\"#\" + \" \" * (ancho - 2) + \"#\")\nprint(\"#\" + \" \" * (ancho - 2) + \"#\")\nprint(\"#\" * ancho)", "output": "    ^\n   ^^^\n  ^^^^^\n ^^^^^^^\n#########\n#       #\n#       #\n#########", "tip": "La misma fórmula ancho − 2 construye paredes huecas."}, {"tag": "14 · DECISIONES", "title": "Elegir una figura con if", "desc": "El usuario escribe una opción y el programa decide qué figura imprimir.", "code": "opcion = input(\"Figura (1/2): \")\nif opcion == \"1\":\n    print(\"*\" * 5)\n    print(\"*\" * 5)\nelif opcion == \"2\":\n    print(\"*\")\n    print(\"*\" * 2)\n    print(\"*\" * 3)\nelse:\n    print(\"Opción no válida\")", "output": "Figura (1/2): 2\n*\n**\n***", "tip": "if, elif y else permiten seleccionar; todavía no utilizamos repeticiones."}, {"tag": "15 · DECISIONES", "title": "Figura según el tamaño", "desc": "Con if podemos clasificar un número y dibujar una figura de acuerdo con el resultado.", "code": "lado = int(input(\"Lado (2 a 4): \"))\nif lado == 2:\n    print(\"*\" * lado)\n    print(\"*\" * lado)\nelif lado == 3:\n    print(\"*\" * lado)\n    print(\"*\" * lado)\n    print(\"*\" * lado)\nelif lado == 4:\n    print(\"*\" * lado)\n    print(\"*\" * lado)\n    print(\"*\" * lado)\n    print(\"*\" * lado)\nelse:\n    print(\"Tamaño no disponible\")", "output": "Lado (2 a 4): 3\n***\n***\n***", "tip": "Las filas están escritas de forma explícita porque aún no hemos visto ciclos."}, {"tag": "16 · PRÁCTICA", "title": "Reto 1 · Escalera", "desc": "Construye una escalera de cuatro niveles usando una variable llamada base y expresiones aritméticas.", "code": "base = 4\n# Completa los cálculos:\nprint(\"#\" * (base - 3))\nprint(\"#\" * (base - 2))\nprint(\"#\" * (base - 1))\nprint(\"#\" * base)", "output": "#\n##\n###\n####", "tip": "Cambia base a 5 y agrega manualmente una línea más."}, {"tag": "17 · PRÁCTICA", "title": "Reto 2 · Rombo", "desc": "Combina una pirámide de tres niveles y una pirámide invertida sin repetir la fila central.", "code": "altura = 3\nprint(\" \" * 2 + \"*\" * 1)\nprint(\" \" * 1 + \"*\" * 3)\nprint(\" \" * 0 + \"*\" * 5)\nprint(\" \" * 1 + \"*\" * 3)\nprint(\" \" * 2 + \"*\" * 1)", "output": "  *\n ***\n*****\n ***\n  *", "tip": "Calcula los espacios y estrellas a partir de la distancia al centro."}, {"tag": "18 · CIERRE", "title": "Ahora sí: programar es calcular", "desc": "No copiamos dibujos: usamos operaciones para construirlos. En la próxima clase podremos automatizar las filas con ciclos.", "code": "simbolo = \"★\"\nancho = 7\nprint(\" \" * 3 + simbolo)\nprint(\" \" * 2 + simbolo * 3)\nprint(\" \" * 1 + simbolo * 5)\nprint(simbolo * ancho)", "output": "   ★\n  ★★★\n ★★★★★\n★★★★★★★", "tip": "Dominamos multiplicación de cadenas, concatenación, variables e if/elif/else."}];let index=0,visible=false;const $=id=>document.getElementById(id);function render(){const s=slides[index];$('tag').textContent=s.tag+' · '+(index+1)+' / '+slides.length;$('title').textContent=s.title;$('desc').textContent=s.desc;$('tip').textContent='CLAVE: '+s.tip;$('code').textContent=s.code;$('count').textContent=(index+1)+' / '+slides.length;$('fill').style.width=((index+1)/slides.length*100)+'%';$('prev').disabled=index===0;$('next').textContent=index===slides.length-1?'Volver al inicio ↻':'Siguiente →';visible=false;output()}function output(){$('output').textContent=visible?slides[index].output:'Presiona «Mostrar resultado» para ver la figura.'}$('next').onclick=()=>{index=(index+1)%slides.length;render()};$('prev').onclick=()=>{index=Math.max(0,index-1);render()};$('show').onclick=()=>{visible=true;output()};$('hide').onclick=()=>{visible=false;output()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(slides[index].code);$('copy').textContent='¡Copiado!';setTimeout(()=>$('copy').textContent='Copiar código',1300)}catch(e){$('copy').textContent='Selecciona el código'}};$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
// Guía automática: interpreta cada instrucción a nivel introductorio.
let explainTimer=null,explainIndex=0,explainPaused=false,explainLines=[];
function explainMeaning(line){const t=line.trim();
if(!t)return 'Línea en blanco: separa las partes del programa para facilitar la lectura.';
if(t.startsWith('#'))return 'Comentario: explica el código. Python no ejecuta esta línea.';
if(t.startsWith('if '))return 'Python evalúa esta condición. Si es verdadera, ejecuta las líneas indentadas que siguen.';
if(t.startsWith('elif '))return 'Si la condición anterior fue falsa, Python comprueba esta nueva opción.';
if(t.startsWith('else:'))return 'Si ninguna condición anterior se cumple, Python ejecuta este bloque alternativo.';
if(t.includes('input('))return 'Se solicita un dato al usuario. input() devuelve texto; int() lo convierte a número entero cuando corresponde.';
if(t.startsWith('print(')){
let parts=[];
if(t.includes('" " *')||t.includes("' ' *"))parts.push('Calcula los espacios iniciales para colocar la figura en la posición correcta');
if(t.includes('"*" *')||t.includes('"#" *')||t.includes('"■" *')||t.includes('simbolo *'))parts.push('multiplica el símbolo por una cantidad calculada para formar el dibujo');
if(t.includes(' - '))parts.push('la resta ajusta la cantidad de caracteres');
if(t.includes('2 *'))parts.push('la expresión 2 × nivel − 1 produce cantidades impares de estrellas');
if(parts.length)return 'print() construye una línea: '+parts.join('; ')+'. El resultado se muestra en la consola.';
return 'print() muestra en consola el valor o texto de esta expresión. Las cadenas se unen con + y se repiten con *.';
}
if(t.includes(' = ')){
const [name,value]=t.split(/ = (.+)/);if(value.includes('" "'))return 'Se guarda en «'+name.trim()+'» una cadena formada por espacios y símbolos; el cálculo determina su longitud.';
if(value.includes('"*"')||value.includes('"#"')||value.includes('"■"'))return 'La variable «'+name.trim()+'» almacena caracteres repetidos según el valor calculado.';
return 'Se asigna a «'+name.trim()+'» el resultado de la expresión '+value+'. Después podremos reutilizar ese valor.';
}
return 'Python procesa esta instrucción siguiendo el orden del programa.';
}
function paintCode(){const lines=slides[index].code.split('\n');$('code').innerHTML='';lines.forEach((line,i)=>{const span=document.createElement('span');span.className='code-line'+(i===explainIndex?' active-code-line':'');span.textContent=line||' ';$('code').appendChild(span)});const active=$('code').children[explainIndex];if(active){const panel=$('code');const top=active.offsetTop-panel.offsetTop;if(top<panel.scrollTop||top>panel.scrollTop+panel.clientHeight-35)panel.scrollTop=Math.max(0,top-50)}}
function explainStep(){if(!explainLines.length)return;if(explainIndex>=explainLines.length){explainIndex=0;}const line=explainLines[explainIndex];$('stepnum').textContent=String(explainIndex+1).padStart(2,'0');$('stepcount').textContent=(explainIndex+1)+' / '+explainLines.length;$('stepline').textContent=line.trim()||'— separación —';$('stepdetail').textContent=explainMeaning(line);$('walkfill').style.width=((explainIndex+1)/explainLines.length*100)+'%';paintCode();}
function startExplanation(){clearInterval(explainTimer);explainLines=slides[index].code.split('\n');explainIndex=0;explainPaused=false;$('pauseExplain').textContent='⏸ Pausar';explainStep();explainTimer=setInterval(()=>{if(explainPaused)return;if(explainIndex<explainLines.length-1){explainIndex++;explainStep()}else{clearInterval(explainTimer);explainTimer=null;$('stepdetail').textContent+='  ✓ Explicación terminada. Puedes pulsar «Repetir» para verla de nuevo.';}},3000)}
$('pauseExplain').onclick=()=>{explainPaused=!explainPaused;$('pauseExplain').textContent=explainPaused?'▶ Continuar':'⏸ Pausar'};
$('restartExplain').onclick=startExplanation;

// Datos solicitados mediante input() y vista previa calculada en el navegador.
const inputDefs={
0:[['ancho',7,2,20]],1:[['cantidad',5,1,20]],2:[['espacios',3,0,20],['estrellas',5,1,20]],
3:[['lado',5,2,9]],4:[['lado',6,3,9]],5:[['ancho',9,2,20],['alto',4,2,9]],
6:[['base',5,2,9]],7:[['base',5,2,9]],8:[['altura',5,2,9]],9:[['altura',4,2,9]],
10:[['h',5,2,9]],11:[['ancho',9,7,19]],12:[['ancho',9,7,19]],
13:[['opcion',2,1,3]],14:[['lado',3,2,4]],15:[['base',4,2,9]],16:[['altura',3,2,9]],17:[['ancho',7,3,19]]
};
const inputValues={};
function codeFor(i){let code=slides[i].code;const def=inputDefs[i];if(!def)return code;
// Todas las variables configurables se leen con input() en el código que copia el estudiante.
for(const [name,defaultVal] of def){const re=new RegExp('^'+name+'\\s*=\\s*.*$','m');const line=`${name} = int(input("Ingresa ${name}: "))`;if(re.test(code))code=code.replace(re,line);else code=line+'\n'+code;}
return code;
}
function valuesFor(i){return Object.fromEntries((inputDefs[i]||[]).map(([n,d])=>[n,inputValues[i]?.[n]??d]));}
function resultFor(i){const v=valuesFor(i),line=(ch,n)=>ch.repeat(Math.max(0,n)),lines=[];
const pyramid=(h,ch='*')=>Array.from({length:h},(_,j)=>line(' ',h-j-1)+line(ch,2*j+1));
switch(i){
case 0:return line('*',v.ancho);
case 1:return (3*v.cantidad)+'\n'+line('#',v.cantidad);
case 2:return line(' ',v.espacios)+line('*',v.estrellas);
case 3:return Array(v.lado).fill(line('■',v.lado)).join('\n');
case 4:return [line('*',v.lado),...Array(v.lado-2).fill('*'+line(' ',v.lado-2)+'*'),line('*',v.lado)].join('\n');
case 5:return Array(v.alto).fill(line('#',v.ancho)).join('\n');
case 6:return Array.from({length:v.base},(_,j)=>line('*',j+1)).join('\n');
case 7:return Array.from({length:v.base},(_,j)=>line('*',v.base-j)).join('\n');
case 8:return pyramid(v.altura).join('\n');
case 9:return pyramid(v.altura).reverse().join('\n');
case 10:return [...pyramid(v.h),line(' ',v.h-1)+'|',line(' ',v.h-1)+'|'].join('\n');
case 11:{let n=v.ancho,half=Math.floor(n/2);return [line(' ',half)+'*',line(' ',half-1)+'***',line('*',n),line(' ',Math.max(0,half-2))+line('*',Math.min(n,5)),line(' ',Math.max(0,half-3))+'**'+line(' ',3)+'**','*'+line(' ',n-2)+'*'].join('\n')}
case 12:{let n=v.ancho,roof=Math.floor((n-1)/2);return [...Array.from({length:roof},(_,j)=>line(' ',roof-j)+line('^',2*j+1)),line('#',n),'#'+line(' ',n-2)+'#','#'+line(' ',n-2)+'#',line('#',n)].join('\n')}
case 13:return 'Figura (1/2): '+v.opcion+'\n'+(v.opcion===1?'*****\n*****':v.opcion===2?'*\n**\n***':'Opción no válida');
case 14:return 'Lado (2 a 4): '+v.lado+'\n'+Array(v.lado).fill(line('*',v.lado)).join('\n');
case 15:return Array.from({length:v.base},(_,j)=>line('#',j+1)).join('\n');
case 16:return [...pyramid(v.altura),...pyramid(v.altura).slice(0,-1).reverse()].join('\n');
case 17:return pyramid(Math.floor((v.ancho+1)/2),'★').join('\n');
default:return slides[i].output;
}}
function dynamicCode(i){let v=valuesFor(i),code=codeFor(i);
// Se conservan las expresiones aritméticas, sustituyendo las filas manuales
// cuando la altura ingresada modifica el número de líneas.
const repeatPrint=(expr,n)=>Array(n).fill('print('+expr+')').join('\n');
if(i===3)code=`lado = int(input("Ingresa lado: "))\nlinea = "■" * lado\n${repeatPrint('linea',v.lado)}`;
if(i===4)code=`lado = int(input("Ingresa lado: "))\nborde = "*" * lado\ncentro = "*" + " " * (lado - 2) + "*"\nprint(borde)\n${repeatPrint('centro',v.lado-2)}\nprint(borde)`;
if(i===5)code=`ancho = int(input("Ingresa ancho: "))\nalto = int(input("Ingresa alto: "))\nlinea = "#" * ancho\n${repeatPrint('linea',v.alto)}`;
if(i===6)code=`base = int(input("Ingresa base: "))\n`+Array.from({length:v.base},(_,j)=>`print("*" * (base - ${v.base-j-1}))`).join('\n');
if(i===7)code=`base = int(input("Ingresa base: "))\n`+Array.from({length:v.base},(_,j)=>`print("*" * (base - ${j}))`).join('\n');
if(i===8||i===9||i===10||i===16||i===17){let h=(i===10?v.h:i===17?Math.floor((v.ancho+1)/2):i===16?v.altura:v.altura),name=i===10?'h':i===17?'ancho':'altura',sym=i===17?'★':'*';const expr=(level)=>`print(" " * (${h} - ${level}) + "${sym}" * (2 * ${level} - 1))`;let ls=[];if(i===9)for(let j=h;j>=1;j--)ls.push(expr(j));else for(let j=1;j<=h;j++)ls.push(expr(j));if(i===10)ls.push('print(" " * (h - 1) + "|")','print(" " * (h - 1) + "|")');if(i===16)for(let j=h-1;j>=1;j--)ls.push(expr(j));code=`${name} = int(input("Ingresa ${name}: "))\n`+ls.join('\n')}
if(i===12){const h=Math.floor((v.ancho-1)/2);code=`ancho = int(input("Ingresa ancho: "))\n`+Array.from({length:h},(_,j)=>`print(" " * (${h}-${j}) + "^" * (2 * ${j+1}-1))`).join('\n')+'\nprint("#" * ancho)\nprint("#" + " " * (ancho - 2) + "#")\nprint("#" + " " * (ancho - 2) + "#")\nprint("#" * ancho)'}
if(i===14){code=`lado = int(input("Lado (2 a 4): "))\n`+[2,3,4].map((n,j)=>(j===0?'if': 'elif')+` lado == ${n}:\n`+Array(n).fill('    print("*" * lado)').join('\n')).join('\n')+'\nelse:\n    print("Tamaño no disponible")'}
if(i===15)code=`base = int(input("Ingresa base: "))\n`+Array.from({length:v.base},(_,j)=>`print("#" * (base - ${v.base-j-1}))`).join('\n');
return code;
}
function renderInputs(){const box=$('inputs');box.innerHTML='';const defs=inputDefs[index]||[];if(!inputValues[index])inputValues[index]={};defs.forEach(([name,defaultVal,min,max])=>{const label=document.createElement('label');label.textContent=name+' ';const input=document.createElement('input');input.type='number';input.min=min;input.max=max;input.step=1;input.value=inputValues[index][name]??defaultVal;input.setAttribute('aria-label',name);input.oninput=()=>{const num=Number(input.value);if(!Number.isInteger(num)||num<min||num>max){input.setCustomValidity(`Usa un entero entre ${min} y ${max}`);input.reportValidity();return}input.setCustomValidity('');inputValues[index][name]=num;updateInteractive()};label.appendChild(input);box.appendChild(label)});const note=document.createElement('small');note.textContent='Los valores modifican el código y la figura. Sin ciclos ni importaciones.';box.appendChild(note)}
function updateInteractive(){slides[index].code=dynamicCode(index);slides[index].output=resultFor(index);explainLines=slides[index].code.split('\n');explainIndex=0;explainStep();if(visible)output();else $('output').textContent='Presiona «Mostrar resultado» para ver la figura.'}
const priorRender=render;render=function(){priorRender();renderInputs();updateInteractive()};
// El render original ya se ejecutó al cargar: activar los campos de la primera diapositiva.
renderInputs();updateInteractive();
</script></body></html>
