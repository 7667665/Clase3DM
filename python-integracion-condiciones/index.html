<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITQ · Python: integración y resolución de problemas</title><style>
:root{--ink:#172333;--muted:#5d6b7a;--red:#b71f3a;--bg:#f4f6f8;--line:#dce2e9;--blue:#2760bd;--green:#147e67}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}.shell{height:100dvh;display:flex;flex-direction:column}.top{flex:none;height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px}.logo{font-weight:800;letter-spacing:.04em}.logo:before{content:"";display:inline-block;width:10px;height:10px;background:var(--red);border-radius:50%;margin-right:9px}.tag{font-size:12px;color:var(--muted)}.progress{height:4px;background:#e0e4ea}.bar{height:100%;background:var(--red);width:0;transition:width .4s}.main{flex:1;min-height:0;overflow:auto;padding:clamp(22px,3.2vw,52px) clamp(24px,5vw,82px);position:relative;background:radial-gradient(circle at 90% 5%,#fce7eb 0,transparent 25%),var(--bg)}.slide{min-height:100%;display:flex;flex-direction:column;gap:18px;animation:appear .5s ease both}.eyebrow{font-size:12px;color:var(--red);font-weight:800;letter-spacing:.15em}.heading{font-size:clamp(32px,4.6vw,65px);line-height:1.04;letter-spacing:-.05em;margin:0;max-width:1150px}.sub{font-size:clamp(16px,1.5vw,21px);line-height:1.5;color:var(--muted);margin:0;max-width:1000px}.workspace{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:280px}.pane{background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(18px,2.2vw,30px);box-shadow:0 10px 30px #1723330a;min-width:0}.pane h3{margin:0 0 17px;font-size:20px}.codebox{background:#192536;color:#dcefff;border-radius:10px;padding:18px 20px;font:clamp(14px,1.25vw,19px)/1.8 Consolas,monospace;white-space:pre-wrap;overflow:auto;tab-size:4}.codebox .kw{color:#ffbf7d}.codebox .str{color:#a6e8b8}.codebox .comment{color:#95a9be}.codebox .num{color:#b8a6ff}.result{padding:15px 18px;border-radius:10px;background:#eff8f5;border:1px solid #b9e1d4;color:#11664f;font-weight:700;font-size:clamp(17px,1.6vw,23px);min-height:60px;white-space:pre-wrap}.btn{background:#fff;color:var(--ink);border:1px solid #c6d0da;padding:11px 17px;border-radius:8px;font-weight:700}.btn:hover{border-color:var(--red);transform:translateY(-2px)}.primary{background:var(--red);color:white;border-color:var(--red)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{width:130px;max-width:100%;padding:11px 12px;border:1px solid #bbc6d2;border-radius:8px;background:white;color:var(--ink)}label{font-size:14px;font-weight:650;display:flex;flex-direction:column;gap:6px}.note{color:var(--muted);font-size:15px;line-height:1.55}.big{font-size:clamp(24px,3vw,43px);font-weight:800;line-height:1.18}.flow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.flow>div{flex:1;min-width:135px;background:#f3f6fa;padding:22px;border-radius:12px;border:1px solid #dbe2ea;font-weight:700;text-align:center;animation:rise .5s both}.flow>div:nth-child(2){animation-delay:.15s}.flow>div:nth-child(3){animation-delay:.3s}.mini{color:var(--red);font-size:13px;letter-spacing:.1em;font-weight:800}.pill{padding:8px 12px;background:#eef3fa;color:#28528c;border-radius:7px;font-family:Consolas,monospace}.choice{width:100%;display:block;text-align:left;margin:8px 0}.choice.good{background:#d9f4e8;border-color:#15936b}.choice.bad{background:#ffdde2;border-color:#d33c53}.step{background:#f5f7fa;border-left:4px solid var(--red);padding:16px 20px;border-radius:6px;animation:rise .4s both}.bottom{height:68px;flex:none;background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:10px}.muted{color:var(--muted);font-size:13px}.grow{flex:1}.reveal{display:none}.reveal.show{display:block;animation:rise .4s both}.bullets{margin:0;padding-left:23px;line-height:2;font-size:clamp(16px,1.5vw,20px)}.side-note{font-size:14px;color:var(--muted);margin-top:auto}.numBadge{font-size:60px;color:var(--red);font-weight:850;letter-spacing:-.05em}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(max-width:780px){.workspace{grid-template-columns:1fr}.main{padding:20px}.top{padding:0 14px}.bottom{padding:0 10px}.btn{padding:9px 11px}.heading{font-size:35px}.pane{padding:17px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
.timerface{font-size:clamp(44px,6vw,85px);font-weight:850;letter-spacing:-.07em;font-variant-numeric:tabular-nums;color:var(--red);margin:15px 0}.locked{border:1px dashed #d6a3ac;border-radius:12px;padding:18px;background:#fff8f9;color:#7a4250}.timerhelp{font-size:13px;color:var(--muted)}.exercisebox{background:#f7f9fc;border-left:5px solid var(--red);padding:20px;border-radius:8px;font-size:19px;line-height:1.6}</style></head><body><div class="shell"><div class="top"><div class="logo">ITQ / INTRODUCCIÓN A LA PROGRAMACIÓN</div><div class="tag">Python · Integración de fundamentos · 120 min</div></div><div class="progress"><div class="bar" id="bar"></div></div><main class="main" id="main"></main><div class="bottom"><button class="btn" id="prev">← Anterior</button><span class="muted" id="count"></span><div class="row"><button class="btn" id="fullscreen">⛶ Pantalla completa</button><button class="btn primary" id="next">Siguiente →</button></div></div></div>
<script>
const slides=[["INICIO", "De datos a soluciones", "Integramos variables, tipos, operadores y buenas prácticas para resolver problemas reales.", "cover", 3], ["MAPA", "¿Cómo piensa un programa?", "Entrada → procesamiento → salida. La estructura que utilizaremos en toda la clase.", "flow", 3], ["REPASO APLICADO", "Una variable tiene propósito", "Elegimos nombres, tipos y operaciones adecuados para cada dato.", "types", 3], ["INTEGRACIÓN", "De input() a un resultado", "El texto que ingresa el usuario se convierte antes de calcular.", "convert", 3], ["PRÁCTICA INDIVIDUAL 01", "Calcula una compra", "Lee el enunciado, escribe tu solución y luego revisa la respuesta.", "exercise1", 10], ["CONSTRUCCIÓN", "Un programa en cuatro pasos", "Observa cómo se arma una solución línea por línea.", "step", 4], ["PRÁCTICA GUIADA", "Costo de una compra", "Producto, cantidad, precio y total con formato.", "shopping", 4], ["CONCEPTO", "Expresiones compuestas", "Una expresión puede mezclar variables, paréntesis y operaciones.", "expr", 3], ["EXPLORADOR", "La precedencia cambia resultados", "Cambia el orden y compara los resultados.", "precedence", 3], ["APLICACIÓN", "Promedio ponderado", "Las notas tienen distintos pesos; los paréntesis importan.", "weighted", 4], ["BUENAS PRÁCTICAS", "Código que se entiende", "Nombres descriptivos, constantes, espacios y comentarios útiles.", "clean", 3], ["COMPARACIÓN", "¿Qué versión mantendrías?", "Compara código confuso con código legible.", "refactor", 4], ["DATOS", "Elegir el tipo correcto", "Los códigos no siempre son números para calcular.", "datatype", 4], ["RELACIONALES", "Comprobar requisitos", "Las comparaciones devuelven True o False.", "compare", 4], ["CONDICIONES", "¿Qué es una condición en Python?", "Una condición es una expresión que se evalúa como True o False.", "conditions", 5], ["LÓGICA", "Condiciones combinadas", "Una regla de negocio se expresa con and, or y not.", "logic", 4], ["PRÁCTICA INDIVIDUAL 02", "¿Cumple los requisitos?", "Escribe una expresión booleana con dos comparaciones.", "exercise2", 10], ["CASO REAL", "¿Puede acceder al laboratorio?", "Dos requisitos que deben cumplirse simultáneamente.", "access", 4], ["CASO REAL", "¿Aplica un descuento?", "Evaluar una promoción sin usar todavía if.", "discount", 4], ["DEPURACIÓN", "Encuentra el error", "Identifica errores de tipo, precedencia y sintaxis.", "debug", 4], ["MÉTODO", "Resolver sin improvisar", "Leer, identificar datos, diseñar fórmula, programar y probar.", "method", 4], ["DESAFÍO GUIADO", "Viaje en transporte", "Calcular costo de pasajes y presupuesto restante.", "transport", 4], ["PRÁCTICA INDIVIDUAL 03", "Presupuesto de transporte", "Combina operaciones y una condición en un programa pequeño.", "exercise3", 10], ["MINIQUIZ", "¿Qué devuelve Python?", "Predice el resultado antes de ver la respuesta.", "quiz", 4], ["LABORATORIO", "Modifica y comprueba", "Cambia entradas y observa cómo se transforma la salida.", "lab", 4], ["RETO FINAL", "Sistema de compra", "Integra entrada, cálculos, comparaciones y formato.", "challenge", 4], ["CIERRE", "Checklist de un buen programa", "Revisa nombres, tipos, cálculos y pruebas.", "check", 4]];let i=0,step=0;const exerciseClocks={};let ticker=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const code=s=>'<div class="codebox">'+esc(s)+'</div>';
const pane=(h,x)=>'<div class="pane"><h3>'+h+'</h3>'+x+'</div>';
const layout=(a,b)=>'<div class="workspace">'+a+b+'</div>';
const output=()=>'<div id="out" class="result">Resultado pendiente…</div>';
const btn=(label,fn)=>'<button class="btn primary" onclick="'+fn+'">'+label+'</button>';
const input=(id,label,val,type='number')=>'<label>'+label+'<input class="field" id="'+id+'" type="'+type+'" value="'+val+'"></label>';
const reveal=(content)=>'<button class="btn" onclick="toggleReveal()">Mostrar / ocultar solución</button><div id="reveal" class="reveal">'+content+'</div>';
function timedExercise(id,statement,hint,solution){return layout(pane('ENUNCIADO · Trabaja de forma individual','<div class="exercisebox">'+statement+'</div><p class="note" style="margin-top:18px"><strong>Objetivo:</strong> usar variables, tipos, operadores y print(). No utilizar if ni ciclos.</p><div class="step" style="margin-top:18px">'+hint+'</div>'),pane('10 minutos para resolver','<p class="note">La respuesta permanece oculta hasta que termine el tiempo. Puedes cambiar de diapositiva: el reloj continúa.</p><div class="timerface" id="clock">10:00</div><div class="row"><button class="btn primary" id="startTimer" data-id="'+id+'" onclick="startExerciseTimer(this.dataset.id)">▶ Iniciar 10 minutos</button><button class="btn" data-id="'+id+'" onclick="resetExerciseTimer(this.dataset.id)">↺ Reiniciar</button></div><div id="solutionBox" class="locked" style="margin-top:18px">🔒 Solución bloqueada durante el ejercicio.</div><div id="solutionData" hidden>'+solution+'</div></div>'))}
function startExerciseTimer(id){if(!exerciseClocks[id])exerciseClocks[id]={end:Date.now()+600000,done:false};updateTimer(id)}
function resetExerciseTimer(id){delete exerciseClocks[id];updateTimer(id)}
function updateTimer(id){let state=exerciseClocks[id],remain=state?Math.max(0,Math.ceil((state.end-Date.now())/1000)):600;let clock=$('clock');if(!clock)return;clock.textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');let box=$('solutionBox'),btn=$('startTimer');if(btn)btn.disabled=!!state;if(state&&remain===0){state.done=true;box.className='';box.innerHTML='<button class="btn primary" onclick="revealTimedSolution()">Mostrar solución</button><div id="timedSolution" class="reveal"></div>'}else{box.className='locked';box.textContent='🔒 Solución bloqueada durante el ejercicio.'}}
function revealTimedSolution(){let el=$('timedSolution');if(el){el.innerHTML=$('solutionData').innerHTML;el.classList.add('show')}}
function toggleReveal(){$('reveal')?.classList.toggle('show')}
function out(v){if($('out'))$('out').textContent=String(v)}
function question(q,opts,correct,why){return layout(pane('Razona antes de ejecutar','<div class="big">'+q+'</div><p class="note">Explica tu respuesta en voz alta.</p>'),pane('Selecciona una respuesta',opts.map((x,j)=>'<button class="btn choice" onclick="pick(this,'+j+','+correct+',\''+why.replace(/'/g,'&#39;')+'\')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('')+output()))}
function pick(el,j,c,why){document.querySelectorAll('.choice').forEach((x,k)=>{x.disabled=true;if(k===c)x.classList.add('good');else if(k===j)x.classList.add('bad')});out((j===c?'✓ Correcto. ':'✗ Revisa. ')+why)}
function section(s){switch(s[3]){
case 'conditions':return layout(pane('Condición = pregunta con respuesta booleana',code('edad = 19\nmayor_edad = edad >= 18\nprint(mayor_edad)  # True\n\nnota = 6\naprobado = nota >= 7\nprint(aprobado)  # False')+'<p class="note">Los operadores ==, !=, &gt;, &lt;, &gt;= y &lt;= permiten comparar.</p>'),pane('Combina condiciones',code('edad >= 18 and matriculado\nnota >= 7 or recuperacion\nnot bloqueado')+'<div class="step"><b>and:</b> ambas son verdaderas</div><div class="step"><b>or:</b> al menos una es verdadera</div><div class="step"><b>not:</b> invierte el resultado</div><p class="note">Hoy usamos condiciones como expresiones; todavía no necesitamos if.</p>'));
case 'exercise1':return timedExercise('01 · Compra en una papelería','Una papelería vende cuadernos a $2.50 cada uno. Solicita con input() la cantidad de cuadernos, calcula el subtotal y muestra el valor con dos decimales. Prueba con 4 cuadernos.','Datos: cantidad (int), precio (float). Operación: multiplicación.',code('precio = 2.50\ncantidad = int(input("Cuadernos: "))\nsubtotal = precio * cantidad\nprint(f"Subtotal: ${subtotal:.2f}")')+'<p>Prueba: 4 cuadernos → $10.00</p>');
case 'exercise2':return timedExercise('02 · Requisitos de matrícula','Solicita la edad y una nota final. Crea una variable llamada cumple_requisitos que sea True únicamente si la edad es al menos 18 y la nota es al menos 7. Imprime el resultado. Prueba edad 19 y nota 8.','Pista: convierte edad con int(), nota con float() y combina dos comparaciones usando and.',code('edad = int(input("Edad: "))\nnota = float(input("Nota: "))\ncumple_requisitos = edad >= 18 and nota >= 7\nprint(cumple_requisitos)')+'<p>Prueba: 19 y 8 → True</p>');
case 'exercise3':return timedExercise('03 · Viajes y presupuesto','Un pasaje cuesta $0.45. Solicita la cantidad de viajes y el presupuesto disponible. Calcula el costo total y el dinero restante. Crea una condición llamada alcanza que indique si el presupuesto cubre el costo. Prueba con 6 viajes y $5.','Pista: usa multiplicación, resta y >=. Muestra dos decimales.',code('pasaje = 0.45\nviajes = int(input("Viajes: "))\npresupuesto = float(input("Presupuesto: "))\ncosto = pasaje * viajes\nrestante = presupuesto - costo\nalcanza = presupuesto >= costo\nprint(f"Costo: ${costo:.2f}")\nprint(f"Restante: ${restante:.2f}")\nprint(f"Alcanza: {alcanza}")')+'<p>Prueba: 6 viajes y $5 → costo $2.70, restante $2.30, True</p>');
case 'cover':return layout(pane('La pregunta de hoy','<div class="big">¿Cómo pasamos de conocer instrucciones a resolver problemas?</div><p class="note">No aprenderemos más comandos por memorizar: construiremos soluciones.</p>'),pane('Ruta de clase','<div class="flow"><div>01<br>Integrar datos</div><div>02<br>Escribir mejor</div><div>03<br>Resolver casos</div></div><p class="note">Con explicaciones, ejemplos progresivos y ejercicios interactivos.</p>'));
case 'flow':return layout(pane('Modelo de trabajo','<div class="flow"><div>ENTRADA<br><small>input()</small></div><div>PROCESO<br><small>operadores</small></div><div>SALIDA<br><small>print()</small></div></div><p class="note">Todo programa pequeño puede explicarse mediante estos tres momentos.</p>'),pane('Ejemplo',code('cantidad = int(input("Cantidad: "))\nprecio = 3.50\ntotal = cantidad * precio\nprint(f"Total: ${total:.2f}")')+reveal('<div class="step">Entrada: cantidad · Proceso: multiplicación · Salida: total formateado.</div>')));
case 'types':return layout(pane('¿Qué guardarías?','<div class="flow"><div>Nombre<br><span class="pill">str</span></div><div>Unidades<br><span class="pill">int</span></div><div>Precio<br><span class="pill">float</span></div></div><p>Un tipo correcto permite operar sin errores.</p>'),pane('Código de ejemplo',code('producto = "Cuaderno"\ncantidad = 4\nprecio = 2.75\ndisponible = True')+reveal('<div class="step">str para texto, int para cantidades enteras, float para precios de práctica y bool para estados.</div>')));
case 'convert':return layout(pane('Antes de calcular',code('cantidad = input("Cantidad: ")\n# cantidad es str\ncantidad = int(cantidad)\nprecio = float(input("Precio: "))\ntotal = cantidad * precio')+'<p class="note">input() siempre entrega texto.</p>'),pane('Compruébalo',input('qty','Cantidad','3')+input('price','Precio','4.5')+'<div style="margin:14px 0">'+btn('Calcular','calc("convert")')+'</div>'+output()));
case 'step':{let parts=['# 1. ENTRADA\\nprecio = float(input("Precio: "))','# 2. ENTRADA\\ncantidad = int(input("Cantidad: "))','# 3. PROCESO\\nsubtotal = precio * cantidad','# 4. SALIDA\\nprint(f"Subtotal: ${subtotal:.2f}")'];return layout(pane('Construcción progresiva','<p class="note">Pulsa «Siguiente línea» para explicar cada instrucción.</p><div id="progressive" class="codebox">'+esc(parts[0])+'</div><div style="margin-top:15px">'+btn('Añadir siguiente línea','advance()')+'</div>'),pane('Guía docente','<div class="step">¿Qué dato necesito?</div><div class="step">¿Qué tipo debe tener?</div><div class="step">¿Qué operación resuelve el problema?</div><div class="step">¿Cómo presento el resultado?</div>'))}
case 'shopping':return layout(pane('Problema: papelería','<p>Una persona compra varios cuadernos. Calcula cuánto debe pagar.</p>'+code('producto = input("Producto: ")\ncantidad = int(input("Cantidad: "))\nprecio = float(input("Precio: "))\ntotal = cantidad * precio\nprint(f"{producto}: ${total:.2f}")')),pane('Simulador',input('qty','Cantidad','5')+input('price','Precio unitario','2.25')+'<div style="margin:14px 0">'+btn('Ejecutar','calc("shopping")')+'</div>'+output()));
case 'expr':return layout(pane('Expresión compuesta',code('total = (precio * cantidad) + envio')+'<p>La expresión combina variables, multiplicación, suma y paréntesis.</p>'),pane('Descompón el cálculo','<div class="flow"><div>precio × cantidad</div><div>+ envío</div><div>= total</div></div>'+reveal('<div class="step">Si precio = 8, cantidad = 3 y envío = 2, entonces total = 26.</div>')));
case 'precedence':return layout(pane('Mismo número, distinto orden',code('2 + 3 * 4\n(2 + 3) * 4')+'<div class="row"><button class="btn" onclick="out(14)">Sin paréntesis</button><button class="btn" onclick="out(20)">Con paréntesis</button></div>'),pane('Resultado',output()+'<p class="note">Primero multiplicaciones; los paréntesis pueden cambiar el orden.</p>'));
case 'weighted':return layout(pane('Promedio con pesos',code('nota1 = 8\nnota2 = 9\nnota3 = 10\npromedio = nota1*0.2 + nota2*0.3 + nota3*0.5')+'<p>Los pesos suman 1.0 (100 %).</p>'),pane('Experimenta',input('n1','Nota 20 %','8')+input('n2','Nota 30 %','9')+input('n3','Nota 50 %','10')+'<div style="margin:12px 0">'+btn('Calcular promedio','calc("weighted")')+'</div>'+output()));
case 'clean':return layout(pane('Cuatro hábitos','<ul class="bullets"><li>Nombres descriptivos: <code>precio_unitario</code></li><li>Espacios alrededor de operadores</li><li>Constantes en mayúsculas por convención</li><li>Comentarios que explican decisiones</li></ul>'),pane('Ejemplo',code('DESCUENTO = 0.10\nprecio_unitario = 12.50\ncantidad = 3\nsubtotal = precio_unitario * cantidad\n# Promoción del 10 %\ntotal = subtotal * (1 - DESCUENTO)')));
case 'refactor':return layout(pane('Antes',code('a=12.5\nb=3\nc=a*b\nprint(c)')+'<p class="note">Funciona, pero no comunica su propósito.</p>'),pane('Después',code('precio_unitario = 12.5\ncantidad = 3\nsubtotal = precio_unitario * cantidad\nprint(f"Subtotal: ${subtotal:.2f}")')+reveal('<div class="step">El resultado no cambia; la legibilidad sí.</div>')));
case 'datatype':return question('Un código de estudiante es "00125". ¿Qué tipo conviene usar?',['int','str','float'],1,'Es un identificador; debe conservar los ceros iniciales.');
case 'compare':return layout(pane('Reglas de comparación',code('edad >= 18\nnota >= 7\nsaldo != 0')+'<p>El resultado de cada comparación es True o False.</p>'),pane('Simulador',input('age','Edad','19')+input('grade','Nota','8')+'<div style="margin:12px 0">'+btn('Comprobar','calc("compare")')+'</div>'+output()));
case 'logic':return layout(pane('Combinar condiciones',code('edad >= 18 and matriculado\nnota >= 7 or recuperacion\nnot bloqueado')+'<p><strong>and:</strong> ambas · <strong>or:</strong> alguna · <strong>not:</strong> negación.</p>'),pane('Tabla breve','<div class="flow"><div>True and False<br>False</div><div>True or False<br>True</div><div>not True<br>False</div></div>'+reveal('<div class="step">La precedencia lógica es: not, and, or. Usa paréntesis para aclarar.</div>')));
case 'access':return layout(pane('Caso: laboratorio',code('edad = 19\nmatriculado = True\npuede_entrar = edad >= 18 and matriculado\nprint(puede_entrar)')+'<p>Solo expresiones booleanas: todavía no necesitamos if.</p>'),pane('Modifica los datos',input('age','Edad','19')+'<label>Estado<select class="field" id="status"><option value="si">Matriculado</option><option value="no">No matriculado</option></select></label><div style="margin:12px 0">'+btn('Evaluar','calc("access")')+'</div>'+output()));
case 'discount':return layout(pane('Promoción',code('subtotal = 60\nes_estudiante = True\naplica = subtotal >= 50 and es_estudiante\nprint(aplica)')+'<p>Una expresión booleana responde si se cumple la promoción.</p>'),pane('Simulador',input('subtotal','Subtotal','60')+'<label>Cliente<select class="field" id="status"><option value="si">Estudiante</option><option value="no">General</option></select></label><div style="margin:12px 0">'+btn('Evaluar','calc("discount")')+'</div>'+output()));
case 'debug':return question('¿Qué ocurre con print("Total: " + 25)?',['Muestra Total: 25','TypeError','SyntaxError'],1,'No puedes concatenar str e int directamente; usa str() o f-string.');
case 'method':return layout(pane('Método de cinco pasos','<div class="flow"><div>1. Leer</div><div>2. Datos</div><div>3. Fórmula</div><div>4. Código</div><div>5. Probar</div></div>'),pane('Prueba de escritorio','<p>Antes de ejecutar, utiliza valores sencillos y calcula el resultado manualmente.</p>'+reveal('<div class="step">Ejemplo: 3 productos a $2 cada uno → $6. Si el programa da otro valor, revisa tipos y fórmula.</div>')));
case 'transport':return layout(pane('Problema: transporte',code('pasaje = 0.45\nviajes = 6\npresupuesto = 5\ncosto = pasaje * viajes\nrestante = presupuesto - costo\nalcanza = presupuesto >= costo')+'<p>¿Qué ocurre si aumenta el número de viajes?</p>'),pane('Experimenta',input('trips','Viajes','6')+input('budget','Presupuesto','5')+'<div style="margin:12px 0">'+btn('Calcular','calc("transport")')+'</div>'+output()));
case 'quiz':return question('¿Qué devuelve (10 % 4 == 2) and (3 * 2 > 5)?',['True','False','2'],0,'10 % 4 = 2 y 3 * 2 = 6; ambas comparaciones son True.');
case 'lab':return layout(pane('Laboratorio: costo final','<p>Modifica los valores. Observa cada cálculo.</p>'+input('qty','Cantidad','4')+input('price','Precio','8.5')+input('shipping','Envío','2')+'<div style="margin:14px 0">'+btn('Ejecutar programa','calc("lab")')+'</div>'),pane('Código + consola',code('subtotal = cantidad * precio\ntotal = subtotal + envio\nsupera_30 = total > 30\nprint(total)\nprint(supera_30)')+output()));
case 'challenge':return layout(pane('Proyecto de cierre','<div class="step">Una tienda recibe nombre de producto, cantidad y precio.</div><div class="step">Calcula subtotal y envío fijo de $2.</div><div class="step">Evalúa si el total supera $50.</div><div class="step">Presenta el ticket con dos decimales.</div>'),pane('Pista de código',reveal(code('producto = input("Producto: ")\ncantidad = int(input("Cantidad: "))\nprecio = float(input("Precio: "))\nsubtotal = cantidad * precio\ntotal = subtotal + 2\nsupera_limite = total > 50\nprint(f"{producto}: ${total:.2f}")\nprint(f"Supera $50: {supera_limite}")'))+'<p class="note">Tiempo sugerido: 8 minutos. Sin condicionales ni ciclos.</p>'));
case 'check':return layout(pane('Antes de entregar','<ul class="bullets"><li>¿Usé nombres claros?</li><li>¿Convertí correctamente input()?</li><li>¿Mi fórmula respeta la precedencia?</li><li>¿Mostré los resultados de forma legible?</li><li>¿Probé al menos dos valores?</li></ul>'),pane('Siguiente paso','<div class="numBadge">✓</div><p class="big">Ya puedes integrar fundamentos para resolver problemas.</p><p>Próximo tema: decisiones con if y else.</p>'));
}}
function advance(){let parts=['# 1. ENTRADA\nprecio = float(input("Precio: "))','# 2. ENTRADA\ncantidad = int(input("Cantidad: "))','# 3. PROCESO\nsubtotal = precio * cantidad','# 4. SALIDA\nprint(f"Subtotal: ${subtotal:.2f}")'];step=Math.min(3,step+1);$('progressive').textContent=parts.slice(0,step+1).join('\n\n')}
function val(id){return Number($(id)?.value)}function bool(x){return x?'True':'False'}
function calc(k){let r;switch(k){case 'convert':case 'shopping':r='Total: $'+(val('qty')*val('price')).toFixed(2);break;case 'weighted':r='Promedio: '+(val('n1')*.2+val('n2')*.3+val('n3')*.5).toFixed(2);break;case 'compare':r='Mayor de edad: '+bool(val('age')>=18)+'\nNota suficiente: '+bool(val('grade')>=7);break;case 'access':r='Acceso: '+bool(val('age')>=18&&$('status').value==='si');break;case 'discount':r='Aplica promoción: '+bool(val('subtotal')>=50&&$('status').value==='si');break;case 'transport':{let c=val('trips')*.45;r='Costo: $'+c.toFixed(2)+'\nRestante: $'+(val('budget')-c).toFixed(2)+'\nAlcanza: '+bool(val('budget')>=c);break}case 'lab':{let sub=val('qty')*val('price'),total=sub+val('shipping');r='Subtotal: $'+sub.toFixed(2)+'\nTotal: $'+total.toFixed(2)+'\nSupera $30: '+bool(total>30);break}}out(r)}
function render(){step=0;let s=slides[i];$('main').innerHTML='<section class="slide"><div class="eyebrow">'+s[0]+' · '+s[4]+' MIN</div><h1 class="heading">'+s[1]+'</h1><p class="sub">'+s[2]+'</p>'+section(s)+'<div class="side-note">Docente: Ing. Cristian David Zuñiga López, Mgs. · ITQ</div></section>';$('count').textContent=(i+1)+' / '+slides.length;$('bar').style.width=((i+1)/slides.length*100)+'%';if(ticker)clearInterval(ticker);if(s[3].startsWith('exercise')){let id=s[3];updateTimer(id);ticker=setInterval(()=>updateTimer(id),500)}$('prev').disabled=i===0;$('next').textContent=i===slides.length-1?'Volver al inicio ↺':'Siguiente →'}
$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('next').onclick=()=>{i=(i+1)%slides.length;render()};$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});render();
</script></body></html>
