const data=[["Diseño responsive y adaptación multidispositivo","Una página, diferentes pantallas","El objetivo es que la misma web sea cómoda en móvil, tableta y computadora.","\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">","Esta etiqueta permite que el navegador móvil utilice el ancho real del dispositivo."],["¿Qué significa responsive?","El diseño responde al espacio disponible","El contenido se reorganiza sin obligar a hacer zoom o desplazamiento horizontal.","body { max-width: 1100px; margin: auto; padding: 20px; }","max-width evita que el contenido se estire demasiado y margin:auto lo centra."],["¿Por qué importa?","Una web debe ser usable en cualquier dispositivo","Los botones, textos y tarjetas necesitan tamaños cómodos.","button { padding: 12px 20px; font-size: 16px; }","Un botón con buen padding ofrece una zona de interacción más cómoda."],["Viewport","La etiqueta que no debe faltar","Se coloca dentro del head del documento HTML.","\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">","width=device-width ajusta el ancho al dispositivo; initial-scale=1 establece el zoom inicial."],["Medidas flexibles","Porcentajes frente a píxeles","Evita depender de anchuras fijas para todos los elementos.",".contenedor { width: 90%; max-width: 1000px; margin: auto; }","width:90% aprovecha el espacio disponible y max-width fija un límite."],["Imágenes adaptables","Evita que las imágenes se desborden","Una imagen debe reducirse cuando la pantalla es estrecha.","img { max-width: 100%; height: auto; }","max-width limita la imagen al ancho del contenedor; height:auto conserva la proporción."],["Flexbox","Organiza elementos en una fila o columna","Ideal para menús, cabeceras y grupos de botones.",".menu { display: flex; gap: 15px; align-items: center; }","display:flex activa la distribución flexible y gap agrega separación."],["Flex-wrap","Permite que los elementos salten de línea","Cuando no caben en una fila, se acomodan sta previa.","/* Prueba sugerida */\n/* móvil: 375px */\n/* tableta: 768px */\n/* escritorio: 1100px */","Observa cuántas columnas caben, el tamaño de los textos y si existe desbordamiento."],["Laboratorio guiado","Construye una tienda adaptable","Modifica el CSS y presiona Actualizar para observar el resultado.","/* Cambia el color, las columnas y el breakpoint */\n@media (max-width: 700px) {\n  .cards { grid-template-columns: 1fr; }\n}","El laboratorio tiene un editor de HTML y CSS y una vista previa con tres tamaños de pantalla."],["Actividad 1","Diseña para celular","Crea un encabezado y tres tarjetas que aparezcan en una columna en pantallas pequeñas.","@media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }","Verifica el diseño a 375px y comprueba que los botones puedan pulsarse cómodamente."],["Actividad 2","Adapta para tableta","Haz que las tarjetas se distribuyan en dos columnas entre 700px y 999px.","@media (min-width: 700px) and (max-width: 999px) { .cards { grid-template-columns: repeat(2, 1fr); } }","Ajusta el ancho de la vista previa a 768px y comprueba las dos columnas."],["Actividad 3","Adapta para computadora","En pantallas grandes utiliza tres columnas y limita el ancho del contenido.",".cards { max-width: 1100px; margin: auto; }\n@media (min-width: 1000px) { .cards { grid-template-columns: repeat(3,1fr); } }","A 1100px se observan tres tarjetas por fila, con espacios consistentes."],["Cierre y deber","Una web, múltiples dispositivos","Entrega una página HTML con encabezado, tres tarjetas, imágenes adaptables y estilos para móvil, tableta y escritorio.","/* Entrega: index.html + capturas */\n/* 375px, 768px y 1100px */","Comprueba que no haya desplazamiento horizontal y que la información se lea con facilidad."]];let index=0,step=0,paused=false,timer;const $=x=>document.getElementById(x);

$('editor').value=sample;function steps(){let s=data[index];return s[3].split('\n').filter(x=>x.trim()).map((line,i)=>'Paso '+(i+1)+': observa «'+line.trim()+'». '+s[4])}function renderStep(){let arr=steps();$('explain').textContent=step<arr.length?arr[step]:data[index][4]}function nextStep(){step=step>=steps().length?0:step+1;renderStep()}function restart(){step=0;paused=false;$('pause').textContent='⏸ Pausar';renderStep()}function pauseToggle(){paused=!paused;$('pause').textContent=paused?'▶ Continuar':'⏸ Pausar'}function show(){const s=data[index];$('count').textContent='Diapositiva '+(index+1)+' · Clase del 10 de noviembre';$('title').textContent=s[0];$('subtitle').textContent=s[1];$('intro').textContent=s[2];$('code').textContent=s[3];$('result').textContent=s[4];$('footerCount').textContent=(index+1)+' / '+data.length;$('bar').style.width=(index+1)/data.length*100+'%';$('lab').classList.toggle('on',index===15);restart();clearInterval(timer);timer=setInterval(()=>{if(!paused)nextStep()},3700);if(index===15)updateLab();window.scrollTo(0,0)}function move(n){index=Math.max(0,Math.min(data.length-1,index+n));show()}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}function copyCode(){let t=data[index][3];if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t);else{let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}}function updateLab(){$('preview').srcdoc=$('editor').value}function resetLab(){$('editor').value=sample;updateLab()}function size(w){$('preview').style.width=w+'px';$('preview').style.maxWidth='100%'}document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});size(375);show();
