<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEC-EPN · Santillana · Unidad 3 · Errores de Excel</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#24354d;font:16px/1.6 Arial,sans-serif}header{background:#fff;border-bottom:4px solid #163f78;padding:14px 5%;display:flex;justify-content:space-between;gap:15px;color:#163f78;font-weight:bold}.accent{color:#b62b3b}main{max-width:1240px;margin:20px auto;padding:0 16px}.slide{background:white;border:1px solid #dce4ee;border-radius:14px;min-height:75vh;padding:clamp(24px,4vw,52px)}.eyebrow{font-weight:800;font-size:13px;color:#b62b3b;letter-spacing:.1em}h1{font-size:clamp(28px,4vw,48px);line-height:1.15;margin:12px 0}h2{font-size:clamp(20px,2.8vw,28px);color:#163f78}p.lead{font-size:19px;max-width:850px;color:#52647a}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.panel{padding:22px;background:#f7f9fc;border:1px solid #dce4ee;border-radius:12px}.formula{background:#142b44;color:#f0f7ff;padding:20px;border-radius:10px;white-space:pre-wrap;font:17px/1.6 Consolas,monospace;overflow:auto}.tip{border-left:4px solid #217346;background:#eaf5ee;padding:14px 17px;border-radius:6px}.buttons{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{cursor:pointer;padding:11px 16px;border-radius:8px;border:1px solid #b9c9dc;background:white;color:#163f78;font-weight:700}button.primary{background:#163f78;color:white;border-color:#163f78}button:disabled{opacity:.4;cursor:default}.bottom{max-width:1240px;margin:auto;padding:0 16px 22px;display:flex;justify-content:space-between;align-items:center;gap:8px}.activity{border-top:1px solid #dce4ee;margin-top:24px;padding-top:18px}.feedback{padding:14px;background:#eaf4ee;border:1px solid #c8e2cf;border-radius:8px;margin-top:12px;min-height:50px}.excel{border-collapse:collapse;width:100%;font-size:14px}.excel td,.excel th{border:1px solid #cdd8e2;padding:9px;text-align:left}.excel th{background:#e7f0e9}.excel .bad{color:#a62535;font-weight:bold}.progress{position:fixed;top:0;left:0;background:#b62b3b;height:4px;z-index:5;transition:width .2s}.small{font-size:13px;color:#667b92}@media(max-width:750px){.columns{grid-template-columns:1fr}.slide{min-height:70vh}header{font-size:12px}}</style></head><body><div id="progress" class="progress"></div><header><span>CEC <span class="accent">●</span> EPN · EDUCACIÓN CONTINUA</span><span>EXCEL INTERMEDIO · SANTILLANA</span></header><main><section class="slide"><div class="eyebrow" id="eyebrow"></div><h1 id="heading"></h1><h2 id="subheading"></h2><p class="lead" id="lead"></p><div class="columns"><div class="panel"><h3>Ejemplo en Excel</h3><pre class="formula" id="formula"></pre><p class="small">Las fórmulas usan funciones en español y separador punto y coma; pueden variar según la configuración regional.</p></div><div class="panel"><h3>¿Para qué sirve?</h3><div class="tip" id="tip"></div><p class="small">Cada caso ayuda a detectar problemas en reportes de Santillana.</p></div></div><div class="activity" id="activity"></div></section></main><div class="bottom"><button id="prev" onclick="move(-1)">← Anterior</button><span id="count"></span><div class="buttons"><button onclick="full()">⛶ Pantalla completa</button><button id="next" class="primary" onclick="move(1)">Siguiente →</button></div></div><script>const slides=[["Unidad 3 · Valores de error","Excel Intermedio · Santillana","Aprender a identificar, interpretar y corregir los siete errores principales de Excel y dos errores habituales en fórmulas.","Objetivo: diagnosticar antes de corregir."],["¿Por qué importan los errores?","Control de calidad de datos","Un error en el reporte de ejemplares, costos o ventas puede afectar un informe. Primero identificamos el mensaje, después comprobamos la fórmula y finalmente corregimos la causa.","Ruta: observar → diagnosticar → corregir → comprobar."],["3.1.1 · #¡DIV/0!","División entre cero","Aparece cuando el divisor es cero o una celda vacía interpretada como cero. Ejemplo: calcular precio por ejemplar cuando la cantidad es 0.","=B2/C2  →  C2=0"],["#¡DIV/0! · Solución","Comprobar el divisor","Antes de dividir, revisa que el denominador tenga un valor válido. Puedes usar SI para mostrar un mensaje explicativo.","=SI(C2=0;\"Sin ejemplares\";B2/C2)"],["3.1.2 · #N/A","Dato no disponible","Indica que no se encontró el valor buscado, por ejemplo un código ISBN que no está en el catálogo. No es necesariamente un error de escritura.","=BUSCARV(E2;A2:C6;3;FALSO)"],["#N/A · Solución","Verificar la búsqueda","Comprueba el código, el tipo de dato, los espacios y el rango de búsqueda. Si corresponde, controla el resultado con SI.ND.","=SI.ND(BUSCARV(E2;A2:C6;3;FALSO);\"No encontrado\")"],["3.1.3 · #¿NOMBRE?","Excel no reconoce un nombre","Puede haber una función mal escrita, un nombre de rango inexistente o texto sin comillas. Ejemplo: escribir SUM en lugar de SUMA en Excel en español.","=SUM(B2:B5)"],["#¿NOMBRE? · Solución","Revisar nombres y sintaxis","Comprueba el idioma de las funciones, la existencia del nombre definido y las comillas del texto.","=SUMA(B2:B5)"],["3.1.4 · #¡NULO!","Rangos sin intersección","Ocurre cuando se usa el operador espacio entre rangos que no tienen celdas en común.","=SUMA(B2:B4 D2:D4)"],["#¡NULO! · Solución","Comprobar rangos y separadores","Si buscas una intersección, los rangos deben compartir al menos una celda. Si quieres sumar dos rangos distintos, usa separadores adecuados.","=SUMA(B2:B4;D2:D4)"],["3.1.5 · #¡NUM!","Problema numérico","Aparece cuando un cálculo recibe un argumento numérico no válido o produce un resultado que Excel no puede representar.","=RAIZ(-9)"],["#¡NUM! · Solución","Revisar condiciones matemáticas","Valida que los argumentos estén en el dominio permitido. Por ejemplo, la raíz cuadrada real de un número negativo no está definida.","=RAIZ(9)"],["3.1.6 · #¡REF!","Referencia no válida","Sucede cuando una fórmula apunta a una referencia eliminada o inexistente. Ejemplo: borrar una columna que usaba el reporte.","=SUMA(#¡REF!)"],["#¡REF! · Solución","Restablecer la referencia","Revisa qué filas, columnas u hojas se borraron. Reescribe la referencia válida o usa Deshacer si la eliminación fue accidental.","=SUMA(B2:B6)"],["3.1.7 · #¡VALOR!","Tipo de dato incorrecto","Aparece cuando una operación recibe datos de un tipo que no puede utilizar. Ejemplo: multiplicar una cantidad por el texto «pendiente».","=B2*C2  →  C2=\"pendiente\""],["#¡VALOR! · Solución","Comprobar datos y formatos","Identifica las celdas que contienen texto donde deberían existir números. Corrige el dato original; no ocultes un problema real.","=B2*C2  →  C2=12"],["3.2.1 · Ausencia de paréntesis","Fórmulas incompletas","Los paréntesis agrupan operaciones y argumentos. Excel puede advertir o sugerir una corrección cuando falta alguno.","=SI(B2>100;\"Alto\";\"Bajo\""],["Paréntesis · Solución","Equilibrar aperturas y cierres","Cada paréntesis abierto necesita uno de cierre. Comprueba también el orden de cálculo y los separadores de argumentos.","=SI(B2>100;\"Alto\";\"Bajo\")"],["3.2.2 · Referencias circulares","Una fórmula depende de sí misma","Por ejemplo, si en B2 escribes =B2+1, la celda se referencia a sí misma. También pueden existir ciclos indirectos entre varias celdas.","B2: =B2+1"],["Referencias circulares · Solución","Localizar y romper el ciclo","En Excel, ve a Fórmulas → Comprobación de errores → Referencias circulares. Corrige la referencia. El cálculo iterativo es una opción avanzada y debe ser intencional.","B2: =A2+1"],["Taller Santillana","Diagnóstico de reportes","Revisa un reporte ficticio de ventas editoriales: división por cantidad cero, ISBN no encontrado, texto en costo y referencia borrada. Identifica la causa y escribe la corrección.","Actividad: error → causa → corrección"],["Evaluación final","¿Puedes reconocer el error?","Resuelve el cuestionario de casos y obtén retroalimentación inmediata.","9 temas · 9 preguntas"],["Cierre de la unidad","Detectar no es lo mismo que ocultar","Un reporte confiable corrige el origen del error. Funciones como SI.ERROR pueden ser útiles, pero no deben esconder problemas de datos.","Diagnosticar → corregir → verificar"]],questions=[["Una fórmula divide las ventas entre 0. ¿Qué aparece?",["#¡DIV/0!","#¡REF!","#N/A"],0,"No se puede dividir entre cero."],["Un ISBN no existe en el catálogo buscado. ¿Qué aparece?",["#¡NUM!","#N/A","#¡NULO!"],1,"La búsqueda no encontró una coincidencia."],["Escribes una función que Excel no reconoce.",["#¿NOMBRE?","#¡VALOR!","#¡REF!"],0,"Revisa el nombre de la función."],["Dos rangos no tienen celdas comunes y se cruzan con espacio.",["#¡NULO!","#N/A","#¡DIV/0!"],0,"No existe intersección."],["Intentas calcular RAIZ(-9) en números reales.",["#¡NUM!","#¡REF!","#¿NOMBRE?"],0,"El argumento no es válido para esa función."],["Eliminas una columna usada por una fórmula.",["#¡VALOR!","#¡REF!","#N/A"],1,"La referencia dejó de existir."],["Multiplicas una cifra por texto no numérico.",["#¡VALOR!","#¡NUM!","#¡NULO!"],0,"La operación espera un número."],["Una fórmula tiene un paréntesis sin cerrar.",["Error de sintaxis","#N/A","#¡REF!"],0,"Excel puede mostrar un aviso y proponer una corrección."],["La celda B2 contiene =B2+1.",["Referencia circular","#¡NULO!","#N/A"],0,"La fórmula depende de su propio resultado."]];let i=0,q=0,score=0,answered=false;const $=x=>document.getElementById(x);
function show(){let s=slides[i];$('eyebrow').textContent='UNIDAD 3 · DIAPOSITIVA '+(i+1);$('heading').textContent=s[0];$('subheading').textContent=s[1];$('lead').textContent=s[2];$('formula').textContent=s[3];$('tip').textContent=i===0?'Objetivo: interpretar mensajes de error para mejorar la calidad de los reportes.':i<20?'Ejemplo contextualizado para un reporte de ventas, ejemplares o costos de Santillana.':'Antes de entregar un informe, verifica la causa de cada error.';$('count').textContent=(i+1)+' / '+slides.length;$('progress').style.width=(100*(i+1)/slides.length)+'%';$('prev').disabled=i===0;$('next').disabled=i===slides.length-1;$('activity').innerHTML='';if(i===2)division();if(i===4)lookup();if(i===8)intersection();if(i===14)value();if(i===19)workshop();if(i===20){q=0;score=0;drawQuiz()}}
function move(n){i=Math.max(0,Math.min(slides.length-1,i+n));show();window.scrollTo(0,0)}
function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}
function division(){$('activity').innerHTML='<h3>Prueba: división entre cero</h3><div class="buttons"><label>Ventas ($) <input type="number" id="sales" value="600"></label><label>Ejemplares <input type="number" id="units" value="0"></label><button class="primary" onclick="calcDiv()">Calcular</button></div><div class="feedback" id="result">Haz clic en Calcular.</div>'}
function calcDiv(){let a=Number($('sales').value),b=Number($('units').value);$('result').textContent=b===0?'#¡DIV/0! — El divisor es cero. Solución: revisar la cantidad.':'Resultado: '+(a/b).toFixed(2)+' por ejemplar.'}
function lookup(){$('activity').innerHTML='<h3>Prueba: buscar ISBN</h3><p>Catálogo de ejemplo: ISBN-101, ISBN-102, ISBN-103</p><div class="buttons"><input id="isbn" value="ISBN-999"><button class="primary" onclick="findIsbn()">Buscar</button></div><div class="feedback" id="result">Prueba un código existente o uno ausente.</div>'}
function findIsbn(){let d={'ISBN-101':'Matemática','ISBN-102':'Lengua','ISBN-103':'Ciencias'},v=$('isbn').value.trim().toUpperCase();$('result').textContent=d[v]?'Encontrado: '+d[v]:'#N/A — Código no encontrado en el catálogo.'}
function intersection(){$('activity').innerHTML='<h3>Prueba: ¿hay intersección?</h3><div class="buttons"><select id="range"><option value="yes">B2:D4 y C3:C5</option><option value="no">B2:B4 y D2:D4</option></select><button class="primary" onclick="interResult()">Comprobar</button></div><div class="feedback" id="result">Selecciona dos rangos.</div>'}
function interResult(){$('result').textContent=$('range').value==='yes'?'Sí. Intersección: C3:C4.':'#¡NULO! — Los rangos no tienen celdas comunes.'}
function value(){$('activity').innerHTML='<h3>Prueba: tipo de dato</h3><div class="buttons"><label>Costo unitario <input id="cost" value="pendiente"></label><button class="primary" onclick="calcValue()">Multiplicar por 10</button></div><div class="feedback" id="result">Prueba con texto y con un número.</div>'}
function calcValue(){let v=$('cost').value.trim(),n=Number(v.replace(',','.'));$('result').textContent=v===''||!Number.isFinite(n)?'#¡VALOR! — El dato no es numérico.':'Resultado: '+n*10}
function workshop(){$('activity').innerHTML='<h3>Actividad guiada · Reporte editorial</h3><table class="excel"><tr><th>Dato</th><th>Fórmula o situación</th><th>Diagnóstico</th></tr><tr><td>Precio por libro</td><td>=500/0</td><td><input placeholder="¿Qué error?"></td></tr><tr><td>ISBN ausente</td><td>Búsqueda sin coincidencia</td><td><input placeholder="¿Qué error?"></td></tr><tr><td>Costo total</td><td>=10*"pendiente"</td><td><input placeholder="¿Qué error?"></td></tr><tr><td>Columna borrada</td><td>Referencia eliminada</td><td><input placeholder="¿Qué error?"></td></tr></table><p class="small">Trabajen en parejas. Escriban la causa y la corrección en su cuaderno o archivo Excel.</p>'}
function drawQuiz(){let x=questions[q];$('activity').innerHTML='<h3>Pregunta '+(q+1)+' de '+questions.length+'</h3><p>'+x[0]+'</p><div class="buttons">'+x[1].map((v,j)=>'<button onclick="answer('+j+')">'+v+'</button>').join('')+'</div><div id="result" class="feedback">Selecciona una opción.</div><button class="primary" style="margin-top:12px" onclick="nextQuestion()">Siguiente pregunta →</button>'}
function answer(j){if(answered)return;answered=true;let x=questions[q],ok=j===x[2];if(ok)score++;$('result').textContent=(ok?'✓ Correcto. ':'Respuesta: '+x[1][x[2]]+'. ')+x[3];$('activity').querySelectorAll('.buttons button').forEach(b=>b.disabled=true)}
function nextQuestion(){if(!answered){$('result').textContent='Selecciona una respuesta antes de continuar.';return}answered=false;if(q<questions.length-1){q++;drawQuiz()}else{$('activity').innerHTML='<h3>Evaluación completada</h3><p>Resultado: '+score+' / '+questions.length+'</p><button onclick="q=0;score=0;answered=false;drawQuiz()">Repetir evaluación</button>'}}
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});show();</script></body></html>
